services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - PORT=${CONTAINER_PORT:-3000}
    ports:
      - "${HOST_PORT:-8080}:${CONTAINER_PORT:-3000}"
    init: true
    read_only: true
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
